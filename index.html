<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGERA AGENCY | Official Website</title>
    <!-- Font Awesome for clean functional icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* --- VISUAL IDENTITY & GLOBAL COLOR PALETTE --- */
        :root {
            --midnight-blue: #0A1128;
            --deep-panel: #060B18;
            --gold-gradient: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            --gold-solid: #D4AF37;
            --text-pure-white: #FFFFFF;
            --text-muted: #A0AEC0;
            --form-bg: #121B33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--midnight-blue);
            color: var(--text-pure-white);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- FIXED LEFT-SIDE NAVIGATION PANEL --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background-color: var(--deep-panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            border-right: 2px solid rgba(212, 175, 55, 0.2);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        /* Logo Navigation Anchor Container */
        .logo-container {
            width: 100%;
            text-align: center;
            margin-bottom: 50px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        /* Temporary high-fidelity visual fallback for logo asset */
        .logo-placeholder {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--midnight-blue);
            font-size: 2rem;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .logo-text {
            color: var(--text-pure-white);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Nav links stack */
        .nav-menu {
            width: 100%;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-item a:hover, .nav-item.active a {
            color: var(--text-pure-white);
            background-color: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-solid);
        }

        /* Embedded Sidebar Business Hours info block */
        .sidebar-footer {
            margin-top: auto;
            text-align: center;
            width: 100%;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(160, 174, 192, 0.2);
            padding-top: 20px;
        }

        .sidebar-footer p {
            margin-bottom: 5px;
        }

        /* --- MAIN VIEWPORT SECTION --- */
        .main-content {
            margin-left: 280px;
            width: calc(100% - 280px);
            padding: 60px;
        }

        /* Mobile Header Element wrapper */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--deep-panel);
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1001;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: var(--gold-solid);
            font-size: 1.5rem;
            cursor: pointer;
        }

        section {
            padding: 40px 0;
            border-bottom: 1px solid rgba(160, 174, 192, 0.1);
        }

        .section-title {
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--gold-solid);
            padding-left: 15px;
        }

        /* --- TAB 1: HERO DISPLAY & DETAILS --- */
        .hero-banner {
            background: linear-gradient(rgba(10, 17, 40, 0.85), rgba(10, 17, 40, 0.85)), url('https://unsplash.com') center/cover no-repeat;
            padding: 80px 40px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 700px;
            line-height: 1.6;
        }

        /* --- TAB 2: INTAKE ENGINE & FORM DESIGN --- */
        .services-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: start;
        }

        .services-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .service-card {
            background-color: var(--deep-panel);
            padding: 25px;
            border-radius: 8px;
            border-top: 3px solid var(--gold-solid);
        }

        .service-card h3 {
            margin-bottom: 10px;
            color: var(--text-pure-white);
        }

        .booking-form {
            background-color: var(--deep-panel);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select, textarea {
            background-color: var(--form-bg);
            border: 1px solid rgba(160, 174, 192, 0.3);
            border-radius: 6px;
            padding: 12px 16px;
            color: var(--text-pure-white);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold-solid);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--gold-solid);
            cursor: pointer;
            margin-top: 2px;
        }

        .submit-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 6px;
            padding: 16px;
            color: var(--midnight-blue);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* --- TAB 3: PORTFOLIO MIXED GALLERY GRID --- */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .portfolio-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            height: 250px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            group: hover;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .portfolio-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(6, 11, 24, 0.95), rgba(6, 11, 24, 0.4));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
